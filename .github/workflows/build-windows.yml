name: Construire l'application Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/**"
    paths:
      - "index.html"
      - "assets/**"
      - "build/**"
      - "electron/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Installateur Windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier l'application
        run: npm run check

      - name: Générer l'installateur EXE
        run: npm run dist:win

      - name: Créer la somme de contrôle SHA-256
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Aucun installateur EXE n'a été généré." }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($installer.Name)" | Set-Content -Path release/SHA256SUMS.txt -Encoding ascii

      - name: Publier l'installateur comme artefact
        uses: actions/upload-artifact@v7
        with:
          name: GROS-OEUVRE-PRO-Windows-${{ github.run_number }}
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
